services:
  web:
    build: .
    ports:
      - "${DOCKER_BIND_ADDRESS:-0.0.0.0}:${DOCKER_PORT:-8080}:5173"
    environment:
      HOST: 0.0.0.0
      PORT: "5173"
      DATABASE_PATH: /app/data/bigfive.sqlite
      BASE_URL: ${BASE_URL:-}
    volumes:
      - bigfive-data:/app/data
    restart: unless-stopped
    init: true

volumes:
  bigfive-data:
