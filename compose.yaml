services:
  web:
    build: .
    ports:
      - "${DOCKER_BIND_ADDRESS:-0.0.0.0}:${DOCKER_PORT:-8080}:5173"
    environment:
      HOST: 0.0.0.0
      PORT: "5173"
      DATABASE_PATH: /app/data/bigfive.sqlite
      BASE_URL: ${BASE_URL:-}
      DINGTALK_APP_KEY: ${DINGTALK_APP_KEY:-}
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET:-}
      DINGTALK_BASE_ID: ${DINGTALK_BASE_ID:-}
      DINGTALK_SHEET_ID_OR_NAME: ${DINGTALK_SHEET_ID_OR_NAME:-}
      DINGTALK_USER_ID: ${DINGTALK_USER_ID:-}
      DINGTALK_OPERATOR_ID: ${DINGTALK_OPERATOR_ID:-}
      APP_MAX_CONNECTIONS: ${APP_MAX_CONNECTIONS:-128}
      APP_MAX_CONCURRENT_REQUESTS: ${APP_MAX_CONCURRENT_REQUESTS:-32}
      APP_REQUESTS_PER_SECOND: ${APP_REQUESTS_PER_SECOND:-100}
      APP_API_REQUESTS_PER_MINUTE: ${APP_API_REQUESTS_PER_MINUTE:-180}
      APP_SUBMISSIONS_PER_IP_MINUTE: ${APP_SUBMISSIONS_PER_IP_MINUTE:-30}
      APP_SUBMISSIONS_PER_SESSION_MINUTE: ${APP_SUBMISSIONS_PER_SESSION_MINUTE:-5}
      APP_SUBMISSIONS_PER_MINUTE: ${APP_SUBMISSIONS_PER_MINUTE:-60}
      APP_BODY_TIMEOUT_MS: ${APP_BODY_TIMEOUT_MS:-10000}
      APP_HEADERS_TIMEOUT_MS: ${APP_HEADERS_TIMEOUT_MS:-10000}
      APP_REQUEST_TIMEOUT_MS: ${APP_REQUEST_TIMEOUT_MS:-15000}
      APP_MAX_PENDING_SYNC: ${APP_MAX_PENDING_SYNC:-500}
      APP_LIMITER_MAX_KEYS: ${APP_LIMITER_MAX_KEYS:-10000}
      APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:-}
    volumes:
      - bigfive-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 25s

volumes:
  bigfive-data:
